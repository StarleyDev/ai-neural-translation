<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="105" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.55"/>
  <circle cx="256" cy="215" r="190" fill="url(#glow)"/>

  <!-- subtitle bracket top -->
  <path d="M 150 150 L 120 150 Q 100 150 100 170 L 100 195" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 362 150 L 392 150 Q 412 150 412 170 L 412 195" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- translated subtitle lines -->
  <rect x="150" y="230" width="212" height="26" rx="13" fill="url(#bar)"/>
  <rect x="176" y="278" width="160" height="22" rx="11" fill="#ec4899"/>

  <!-- swap / translate arrows -->
  <g stroke="#e7ecf7" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#softGlow)">
    <path d="M 176 350 H 300"/>
    <path d="M 276 330 L 300 350 L 276 370"/>
    <path d="M 336 388 H 212"/>
    <path d="M 236 368 L 212 388 L 236 408"/>
  </g>

  <!-- subtitle bracket bottom -->
  <path d="M 150 428 L 120 428 Q 100 428 100 408 L 100 383" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 362 428 L 392 428 Q 412 428 412 408 L 412 383" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
</svg>
